[workspace]
members = [
    ".",
    ".xtask", 
]

[workspace.package]
edition = "2024"
rust-version = "1.99.0"
authors = ["Jan Roman Cisowski „j-Cis” <code@cisowscy.com>"]
repository = "https://github.com/j-Cis/egui-knex"


[package]
name = "egui-knex"
version = "0.1.0-dev.2"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
resolver = "3"

[lib]
name = "egui_knex"
crate-type = ["cdylib", "rlib"]


[profile.release]
opt-level = 2

[profile.release.package."*"]
opt-level = 2

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
web-sys = { version = "0.3.107", features = [
    "Window",
    "Document",
    "Element",
    "HtmlCanvasElement",
	"Location",
] }


[dependencies]
eframe = "0.37.0"
# `egui` jest re-eksportowane przez `eframe` (i dalej przez ten crate: `egui_knex::egui`),
# więc osobna zależność `egui` nie jest potrzebna.
