[package]
name = "egui-knex"
version = "0.1.0-dev.1"
authors = ["Jan Roman Cisowski „j-Cis” <code@cisowscy.com>"]
edition = "2024"
rust-version = "1.99.0"
repository = "https://github.com/j-Cis/egui-knex"
resolver = "3"

[lib]
name = "x"
crate-type = ["cdylib", "rlib"]


[profile.release]
opt-level = 2

[profile.release.package."*"]
opt-level = 2

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
web-sys = { version = "0.3.107", features = [
    "Window",
    "Document",
    "Element",
    "HtmlCanvasElement",
	"Location",
] }


[dependencies]
eframe = "0.37.0"
egui = "0.37.0"
